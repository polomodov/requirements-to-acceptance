name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Links and EN/RU parity
        run: python3 tools/check_repo.py
      - name: Issue tasks in both languages
        run: |
          python3 evals/run.py show > /dev/null
          python3 evals/run.py --lang ru show > /dev/null
      - name: Grade the saved run
        run: python3 evals/run.py --lang ru grade ru/evals/runs/2026-11-25-answers.json
